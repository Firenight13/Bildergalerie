<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bildergalerie</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #111827;
    color: white;
}

header {
    text-align: center;
    padding: 45px 20px;
    background: #1f2937;
}

header h1 {
    margin: 0 0 10px;
    font-size: 35px;
}

header p {
    color: #cbd5e1;
}

.gallery {
    max-width: 1200px;
    margin: 30px auto;
    padding: 0 20px;

    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 20px;
}

.card {
    background: #1f2937;
    border-radius: 15px;
    overflow: hidden;
}

.card img {
    width: 100%;
    height: 230px;
    object-fit: cover;
    display: block;
}

.card-content {
    padding: 15px;
}

.card h2 {
    font-size: 18px;
    margin: 0 0 12px;
}

.download {
    display: inline-block;
    padding: 10px 15px;
    background: #22c55e;
    color: white;
    text-decoration: none;
    border-radius: 8px;
    font-weight: bold;
}

.download:hover {
    background: #16a34a;
}

.empty {
    text-align: center;
    padding: 50px;
    color: #cbd5e1;
}
</style>
</head>

<body>

<header>
    <h1>📸 Meine Bildergalerie</h1>
    <p>Bilder ansehen und herunterladen</p>
</header>

<main class="gallery">

    <div class="empty">
        <h2>Noch keine Bilder</h2>
        <p>Die Bilder werden hier erscheinen.</p>
    </div>

</main>

</body>
  </html>
